name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Fetch PawnIO driver installer
        shell: bash
        run: bash tools/fetch-pawnio.sh

      - name: UI smoke test
        run: node tools/ui-smoke.js

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          TAG="V$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already released"; exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          git log --format='- %s' $RANGE | grep -v '^- CI:' > notes.md || true
          gh release create "$TAG" --title "Task Manager Remake $VERSION" --notes-file notes.md \
            src-tauri/target/release/bundle/nsis/*.exe
